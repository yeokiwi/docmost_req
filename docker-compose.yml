services:
  docmost:
    # built from this repository so the requirements feature is included
    build:
      context: .
      args:
        # set NPM_REGISTRY to your internal npm mirror if registry.npmjs.org is blocked
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: docmost-requirements:local
    depends_on:
      - db
      - redis
      - drawio
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: '${APP_SECRET:?Set APP_SECRET in .env - generate one with: openssl rand -hex 32}'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
      # draw.io editor URL as seen by the browser (not a Docker-internal name). Defaults to the
      # self-hosted drawio service below; set DRAWIO_URL in .env when users reach this host by
      # another name, e.g. DRAWIO_URL=http://wiki.example.com:8080
      DRAWIO_URL: '${DRAWIO_URL:-http://localhost:8080}'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  # self-hosted draw.io, so diagrams work without access to embed.diagrams.net
  drawio:
    image: ${DRAWIO_IMAGE:-jgraph/drawio:latest}
    ports:
      - "8080:8080"
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
