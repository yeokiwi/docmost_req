services:
  docmost:
    # built from this repository so the requirements feature is included
    build:
      context: .
      args:
        # set NPM_REGISTRY to your internal npm mirror if registry.npmjs.org is blocked
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: docmost-requirements:local
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: '${APP_SECRET:?Set APP_SECRET in .env - generate one with: openssl rand -hex 32}'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
      # draw.io editor URL as seen by the browser. Leave empty to use https://embed.diagrams.net,
      # or run the optional drawio service below (docker compose --profile drawio up) and set
      # DRAWIO_URL=http://localhost:8080 in .env when the browser has no internet access.
      DRAWIO_URL: '${DRAWIO_URL:-}'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  # optional self-hosted draw.io for networks that cannot reach embed.diagrams.net
  drawio:
    image: jgraph/drawio:latest
    profiles: ["drawio"]
    ports:
      - "8080:8080"
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
